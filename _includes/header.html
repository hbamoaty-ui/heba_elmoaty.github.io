{% assign home = '/' | relative_url %}{% if page.url == '/' %}{% assign home = '' %}{% endif %}
<header class="topbar">
  <div class="wrap">
    <div class="pillbar">
      <a class="mark" href="{% if home == '' %}#top{% else %}{{ home }}{% endif %}" aria-label="Heba Abd Elmoaaty, home"><span class="sel">Heba Abd Elmoaaty<i></i><i></i><i></i><i></i></span></a>
      <nav id="mainnav" aria-label="Main"><ul>
        <li><a href="{{ home }}#about">About</a></li>
        <li><a href="{{ home }}#work">Work</a></li>
        <li><a href="{{ home }}#experience">Experience</a></li>
        <li><a href="{{ '/articles/' | relative_url }}"{% if page.url contains '/articles/' %} aria-current="page"{% endif %}>Articles</a></li>
      </ul></nav>
      <div class="bar-actions">
        <a class="btn primary sm" href="#contact">Contact</a>
        <button class="iconbtn" id="theme-toggle" type="button" aria-label="Switch light or dark theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z" fill="currentColor"/></svg></button>
        <button class="iconbtn menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="mainnav" aria-label="Menu"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
    </div>
  </div>
</header>
